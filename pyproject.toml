[project]
name = "gemma-agent-worker"
version = "0.1.0"
description = "Minimal research harness for a local Gemma coding agent served by llama.cpp"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[project.scripts]
gemma-agent = "gemma_agent.cli:main"
run-experiment = "gemma_agent.research_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["research", "prototype", ".agent"]
